apiVersion: v1
kind: Service
metadata: {name: mysql}
spec:
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: 3306}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mysql}
spec:
  serviceName: mysql
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{containerPort: 3306}]
          env:
            - {name: MYSQL_DATABASE, value: wordpress}
            - {name: MYSQL_USER, value: wordpress}
            - {name: MYSQL_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.wordpress }}, key: DB_PASSWORD}}}
            - {name: MYSQL_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.wordpress }}, key: DB_ROOT_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
          startupProbe: {exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]}, failureThreshold: 30, periodSeconds: 10}
          readinessProbe: {exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]}, periodSeconds: 10}
          livenessProbe: {exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]}, initialDelaySeconds: 45, periodSeconds: 20}
          resources: {{- toYaml .Values.resources.medium | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false}
      volumes: [{name: data, persistentVolumeClaim: {claimName: mysql-data}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mysql-data}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.className }}
  storageClassName: {{ .Values.storage.className }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.storage.mysql }}}}
