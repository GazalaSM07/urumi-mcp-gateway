apiVersion: v1
kind: Service
metadata: {name: wordpress}
spec:
  selector: {app: wordpress}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: wordpress}
spec:
  replicas: 1
  selector: {matchLabels: {app: wordpress}}
  template:
    metadata: {labels: {app: wordpress}}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do sleep 2; done"]
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
      containers:
        - name: wordpress
          image: "{{ .Values.images.wordpress.repository }}:{{ .Values.images.wordpress.tag }}"
          imagePullPolicy: {{ .Values.images.wordpress.pullPolicy }}
          ports: [{containerPort: 80}]
          env:
            - {name: WORDPRESS_DB_HOST, value: mysql}
            - {name: WORDPRESS_DB_USER, value: wordpress}
            - {name: WORDPRESS_DB_NAME, value: wordpress}
            - {name: WORDPRESS_DB_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.wordpress }}, key: DB_PASSWORD}}}
            - {name: WP_HOME, value: "{{ .Values.hosts.scheme }}://{{ .Values.hosts.store }}"}
            - {name: WP_ADMIN_USER, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.wordpress }}, key: WP_ADMIN_USER}}}
            - {name: WP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.wordpress }}, key: WP_ADMIN_PASSWORD}}}
            - {name: WP_ADMIN_EMAIL, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.wordpress }}, key: WP_ADMIN_EMAIL}}}
            - {name: WORDPRESS_CONFIG_EXTRA, value: "define('WP_HOME', getenv('WP_HOME')); define('WP_SITEURL', getenv('WP_HOME'));"}
          volumeMounts: [{name: content, mountPath: /var/www/html}]
          readinessProbe: {httpGet: {path: /wp-login.php, port: 80}, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 5}
          startupProbe: {httpGet: {path: /wp-login.php, port: 80}, failureThreshold: 60, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /wp-login.php, port: 80}, initialDelaySeconds: 50, periodSeconds: 20, timeoutSeconds: 5}
          resources: {{- toYaml .Values.resources.medium | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false}
      volumes: [{name: content, persistentVolumeClaim: {claimName: wordpress-content}}]
