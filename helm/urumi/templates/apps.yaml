apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports: [{containerPort: 8000}]
          env:
            - {name: DB_PATH, value: /data/gateway.db}
            - {name: ADMIN_EMAIL, value: {{ .Values.adminEmail | quote }}}
            - {name: ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.gateway }}, key: ADMIN_PASSWORD}}}
            - {name: FERNET_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.gateway }}, key: FERNET_KEY}}}
            - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.gateway }}, key: OPENAI_API_KEY, optional: true}}}
            - {name: LLM_BASE_URL, value: "{{ .Values.llm.baseUrl }}"}
            - {name: LLM_TIMEOUT_SECONDS, value: {{ .Values.llm.timeoutSeconds | quote }}}
            - {name: LLM_MODEL, value: "{{ .Values.llm.model }}"}
            - {name: CORS_ORIGINS, value: "{{ .Values.hosts.scheme }}://{{ .Values.hosts.dashboard }}"}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 10, periodSeconds: 20}
          resources: {{- toYaml .Values.resources.medium | nindent 12 }}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
      volumes: [{name: data, persistentVolumeClaim: {claimName: gateway-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: dashboard}
spec:
  selector: {app: dashboard}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dashboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: dashboard}}
  template:
    metadata: {labels: {app: dashboard}}
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.images.dashboard.repository }}:{{ .Values.images.dashboard.tag }}"
          imagePullPolicy: {{ .Values.images.dashboard.pullPolicy }}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 5, periodSeconds: 20}
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Service
metadata: {name: woo-mcp}
spec:
  selector: {app: woo-mcp}
  ports: [{name: http, port: 8001, targetPort: 8001}]
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: woo-mcp-gateway-only}
spec:
  podSelector: {matchLabels: {app: woo-mcp}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
      ports:
        - {protocol: TCP, port: 8001}
{{- end }}
{{ if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: inventory-mcp-gateway-only}
spec:
  podSelector: {matchLabels: {app: inventory-mcp}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
      ports:
        - {protocol: TCP, port: 8002}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: metrics-mcp-gateway-only}
spec:
  podSelector: {matchLabels: {app: metrics-mcp}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: gateway}}
      ports:
        - {protocol: TCP, port: 8002}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: woo-mcp}
spec:
  replicas: 1
  selector: {matchLabels: {app: woo-mcp}}
  template:
    metadata: {labels: {app: woo-mcp}}
    spec:
      containers:
        - name: woo-mcp
          image: "{{ .Values.images.wooMcp.repository }}:{{ .Values.images.wooMcp.tag }}"
          imagePullPolicy: {{ .Values.images.wooMcp.pullPolicy }}
          ports: [{containerPort: 8001}]
          env:
            - {name: WC_URL, value: "http://wordpress"}
            - {name: WC_SIGNING_URL, value: "{{ .Values.hosts.scheme }}://{{ .Values.hosts.store }}"}
            - {name: WC_CONSUMER_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.wooCommerce }}, key: WC_CONSUMER_KEY, optional: true}}}
            - {name: WC_CONSUMER_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.secrets.wooCommerce }}, key: WC_CONSUMER_SECRET, optional: true}}}
          readinessProbe: {httpGet: {path: /healthz, port: 8001}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8001}, initialDelaySeconds: 5, periodSeconds: 20}
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
---
