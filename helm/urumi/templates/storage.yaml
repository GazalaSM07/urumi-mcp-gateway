apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: gateway-data}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.className }}
  storageClassName: {{ .Values.storage.className }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.storage.gateway }}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: wordpress-content}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.className }}
  storageClassName: {{ .Values.storage.className }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.storage.wordpress }}}}
{{- if .Values.ollama.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ollama-models}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.storage.className }}
  storageClassName: {{ .Values.storage.className }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.ollama.storage }}}}
{{- end }}
