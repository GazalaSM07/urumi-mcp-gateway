server { listen 8080; root /usr/share/nginx/html; index index.html; location /api/ { proxy_pass http://gateway:8000/api/; proxy_set_header Authorization $http_authorization; proxy_read_timeout 240s; proxy_send_timeout 240s; } location /mcp { proxy_pass http://gateway:8000/mcp; proxy_set_header Authorization $http_authorization; } location / { try_files $uri /index.html; } }
